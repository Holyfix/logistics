version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 zatím nepodporuje typescript-eslint (peer typescript <6.1).
      # Povolit, až nová verze typescript-eslint TypeScript 7 přijme.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Typy Node.js drží krok s verzí Node.js v .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
