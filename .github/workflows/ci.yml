name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Žádné datové soubory v repozitáři
        run: npm run check:data
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
